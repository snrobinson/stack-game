# XcodeGen project definition.
#
# The .xcodeproj is generated rather than committed: it keeps the repo free of a
# 3000-line pbxproj that conflicts on every branch, and it means adding a file is
# just adding a file.
#
#   brew install xcodegen
#   xcodegen generate
#   open StackGame.xcodeproj

name: StackGame

options:
  bundleIdPrefix: com.stackgame
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  StackGameCore:
    path: Packages/StackGameCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

targets:
  StackGame:
    type: application
    platform: iOS
    sources:
      - path: StackGame
    dependencies:
      - package: StackGameCore
        product: StackGameCore
    settings:
      base:
        PRODUCT_NAME: Stack
        PRODUCT_BUNDLE_IDENTIFIER: com.stackgame.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: StackGame/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: StackGame/Resources/StackGame.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only. The isometric composition is built for a tall frame, and
        # shipping a stretched iPad build is worse than shipping none.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          VALIDATE_PRODUCT: YES

  StackGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StackGameTests
    dependencies:
      - target: StackGame
      - package: StackGameCore
        product: StackGameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stackgame.app.tests

schemes:
  StackGame:
    build:
      targets:
        StackGame: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StackGameTests
      # The package's own tests run alongside the app's.
      coverageTargets:
        - StackGame
    archive:
      config: Release
